<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GitLab MR Smart Copy options</title>
  <style>
    body { font-family: sans-serif; padding: 1em; min-width: 320px; }
    input { width: 2em; text-align: center; }
  </style>
</head>
<body>
  <form id="options">
    <p>
      <label for="shortcut-key">Copy MR keyboard shortcut:</label>
      <input id="shortcut-key" type="text" maxlength="1" required>
    </p>
    <p>
      <label for="id-shortcut-key">Copy MR ID keyboard shortcut:</label>
      <input id="id-shortcut-key" type="text" maxlength="1" required>
    </p>
    <button type="submit">Save</button>
  </form>
  <p>Use an uppercase letter for Shift+letter (e.g. C for Shift+C).</p>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>
